<title>ViviDoo｜聯絡我們</title>
<style>
:root{color-scheme:light;--ink:#143d36;--muted:#3d5e57;--line:#dcece7;--paper:#f9faf6;--hero:#edf4ef}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"PingFang TC",sans-serif;line-height:1.65}
a{color:inherit;text-underline-offset:.25em}
.wrap{width:min(1060px,calc(100% - 48px));margin:auto}
header{border-bottom:1px solid var(--line)}
.bar,.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bar{min-height:66px}
.logo{display:inline-flex;align-items:center}
.logo img{display:block;width:auto;height:42px;max-width:140px;object-fit:contain}
nav{display:flex;gap:22px;font-size:.92rem}
.hero{background:radial-gradient(ellipse at 86% 0%, #23736e, transparent 52%), #082f32;color:#fff;padding:clamp(34px,6vw,75px) 0}
.eyebrow,.category,.note{color:var(--muted);font-size:.86rem}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2.1rem,5vw,4rem);letter-spacing:-.045em;line-height:1.18;margin:.2em 0}
.lead{max-width:38em;color:#e7f4ef}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.button{display:inline-flex;align-items:center;padding:9px 17px;border:1px solid var(--ink);border-radius:8px;text-decoration:none;font-weight:650}
.primary{color:white;background:var(--ink)}
section[id]{scroll-margin-top:20px}
.list{padding:38px 0 42px}
.section-heading{border-bottom:1px solid var(--line);padding-bottom:12px;align-items:baseline}
h2{font-size:1.55rem}
.course{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}
.category{padding-top:4px}
h3{font-size:1.12rem}
.course p:not(.category),details{font-size:.93rem;color:var(--muted)}
.course p+p{margin-top:2px}
details{margin-top:6px}
summary{width:fit-content;cursor:pointer;color:var(--ink);font-weight:650}
details ol{margin:8px 0 0;padding-inline-start:1.5em}
.contact{padding:25px 0 42px;background:var(--hero)}
.contact p{margin:4px 0 10px;color:var(--muted)}
@media(max-width:540px){.wrap{width:calc(100% - 32px)}.course{grid-template-columns:1fr;gap:3px}.category{padding:0}.section-heading{gap:3px}.bar{padding:8px 0}nav{gap:12px}}

:root{--champagne:#dfbf83;--champagne-line:#ad8649}
.hero .eyebrow{color:#e7f4ef;display:flex;align-items:center;gap:9px}
.hero .eyebrow::before{content:"";width:19px;height:3px;background:var(--champagne-line);border-radius:2px}
.primary{background:var(--champagne);color:#252318;border-color:var(--champagne)}
.hero .button:not(.primary){border-color:#79c7b8;color:#fff}
.hero h1 em{font-style:normal;text-decoration:underline;text-decoration-color:var(--champagne);text-decoration-thickness:.055em;text-underline-offset:.15em}
.contact{border-top:2px solid #c7aa75}
.section-heading{border-bottom-color:var(--champagne-line)}

.list .section-heading{margin-bottom:18px}
.course{margin-bottom:14px;padding:20px 22px;background:#fff;border:1px solid var(--line);border-inline-start:3px solid var(--champagne-line);border-radius:10px}
.course:last-child{margin-bottom:0}
.course h3{margin-bottom:5px}
.course p+p{margin-top:5px}
.course details{margin-top:10px}
@media(max-width:540px){.course{padding:16px;gap:6px}}

/* ViviDoo brand palette */
:root{--ink:#123c3b;--muted:#45605c;--paper:#f8f6f0;--line:#d8e2dc;--hero:#edf3ee;--brand-teal:#00685f;--champagne:#dfbf83;--champagne-line:#ad8649}
header{background:#fff}
.hero{background:radial-gradient(ellipse at 86% 0%,#17605b,transparent 65%),#082f32}
.hero .eyebrow::before{background:var(--champagne)}
.hero .button:not(.primary){border-color:#85b9ae}
.section-heading{border-bottom-color:var(--line)}
.course{position:relative;overflow:hidden;border:0;border-top:1px solid var(--champagne-line)}
.course::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--champagne-line);border-radius:50% / 48%;pointer-events:none}
.category,summary{color:var(--brand-teal)}
.contact{border-top-color:var(--champagne-line)}
nav{flex-wrap:wrap;column-gap:20px;row-gap:5px}
nav [aria-current="page"]{text-decoration:underline;text-decoration-color:#ad8649;text-underline-offset:6px}
.logo img{display:block;height:58px;width:auto;max-width:140px;object-fit:contain}
address{font-style:normal}
@media(max-width:620px){.bar{gap:6px;padding-block:8px}nav{column-gap:12px}}
</style>
